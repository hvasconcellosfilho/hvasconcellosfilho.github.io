<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --wall: #FFF9EC;
      --ink: #3A3550;
      --ink-60: rgba(58, 53, 80, .6);
      --ink-35: rgba(58, 53, 80, .35);
      --ink-15: rgba(58, 53, 80, .15);
      --page: #FFF9EF;
      --u: min(calc(100vw / 1440), calc(100vh / 900));
    }

    @media (max-width: 819px), (orientation: portrait) and (max-width: 1100px), (orientation: landscape) and (max-height: 500px) {
      :root {
        --u: 1px;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--wall);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* 3D Gallery */
    main#gallery {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: grab;
      z-index: 1;
    }

    main#gallery.dragging {
      cursor: grabbing;
    }

    main#gallery.hover-print {
      cursor: pointer;
    }

    main#gallery canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #veil {
      position: fixed;
      inset: 0;
      background: var(--wall);
      z-index: 25;
      pointer-events: none;
    }

    /* Gallery HUD */
    .gui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .gui-arrows,
    .gui-hint,
    .gui-caption {
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    body.list-open .gui-arrows,
    body.list-open .gui-hint,
    body.list-open .gui-caption {
      opacity: 0;
      visibility: hidden;
    }

    .gui-arrows,
    .gui-toggle {
      pointer-events: auto;
    }

    .mask {
      display: block;
      overflow: hidden;
    }

    .rise {
      display: block;
    }

    .gui-arrows {
      position: absolute;
      right: calc(27 * var(--u));
      bottom: calc(32 * var(--u));
      display: flex;
      flex-direction: row;
      gap: calc(10 * var(--u));
    }

    .arrow-btn {
      width: calc(50 * var(--u));
      height: calc(50 * var(--u));
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .arrow-btn svg {
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
    }

    .arrow-btn:hover {
      background: var(--ink);
      color: var(--wall);
    }

    .gui-hint {
      position: absolute;
      right: calc(27 * var(--u));
      bottom: calc(150 * var(--u));
      text-align: right;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: max(11px, calc(10 * var(--u)));
      letter-spacing: 0.12em;
      line-height: 1.65;
      text-transform: uppercase;
    }

    .gui-toggle {
      position: absolute;
      right: calc(29 * var(--u));
      bottom: calc(104 * var(--u));
      border: 1px solid var(--ink-35);
      border-radius: 99px;
      padding: calc(2 * var(--u));
      display: inline-flex;
      gap: calc(2 * var(--u));
      transition: background 0.3s ease;
    }

    body.list-open .gui-toggle {
      background: var(--page);
    }

    .toggle-btn {
      height: max(24px, calc(22 * var(--u)));
      padding: 0 calc(14 * var(--u));
      border-radius: 99px;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: max(11px, calc(9.5 * var(--u)));
      letter-spacing: 0.12em;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .toggle-btn.active {
      background: var(--ink);
      color: var(--wall);
    }

    .gui-caption {
      position: absolute;
      left: calc(25 * var(--u));
      bottom: calc(30 * var(--u));
    }

    .gui-kicker {
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: max(11px, calc(11.5 * var(--u)));
      letter-spacing: 0.14em;
      width: max-content;
      margin: 0 0 calc(10 * var(--u)) calc(3 * var(--u));
    }

    .gui-headline {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: calc(130 * var(--u));
      line-height: 0.82;
      letter-spacing: 0.005em;
      white-space: nowrap;
      transform: scaleX(0.855);
      transform-origin: bottom left;
      margin: 0;
    }

    .gui-headline .br-mobile {
      display: none;
    }

    .gui-headline .mask {
      padding: 0.08em 0 0.14em;
      margin: -0.08em 0 -0.14em;
    }

    /* Floating Cursor Pill */
    #open-pill {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 22;
      pointer-events: none;
      background: #1e1b2b;
      color: #ffffff;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: max(11px, calc(10 * var(--u)));
      letter-spacing: 0.14em;
      padding: calc(7 * var(--u)) calc(13 * var(--u));
      border-radius: 99px;
      opacity: 0;
      transition: opacity 0.12s ease;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    /* List View */
    section#list {
      position: fixed;
      inset: 0;
      z-index: 14;
      background: var(--page);
      overflow-y: auto;
      padding: 56px 24px 96px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    section#list.open {
      opacity: 1;
      pointer-events: auto;
    }

    .list-heading {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: 0.005em;
      max-width: 1000px;
      margin: 0 auto 32px;
    }

    .list-grid {
      max-width: 1000px;
      margin: 0 auto;
      columns: 3 240px;
      column-gap: 14px;
    }

    .list-grid figure {
      margin: 0 0 14px;
      break-inside: avoid;
      cursor: zoom-in;
      overflow: hidden;
      background: #F6EAD8;
    }

    .list-grid img {
      width: 100%;
      height: auto;
      aspect-ratio: auto 4 / 5;
      display: block;
      transition: transform 0.3s ease;
    }

    .list-grid figure:hover img {
      transform: scale(1.02);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(30, 27, 43, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .lightbox .lb-btn {
      position: absolute;
      color: #FFF9EC;
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      min-width: 44px;
      min-height: 44px;
      padding: 10px 14px;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .lightbox .lb-btn:hover {
      opacity: 1;
    }

    .lightbox .lb-close {
      top: 16px;
      right: 16px;
    }

    .lightbox .lb-prev,
    .lightbox .lb-next {
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      letter-spacing: 0;
    }

    .lightbox .lb-prev {
      left: 8px;
    }

    .lightbox .lb-next {
      right: 8px;
    }

    /* Small-screen layout */
    @media (max-width: 819px), (orientation: portrait) and (max-width: 1100px), (orientation: landscape) and (max-height: 500px) {
      .gui-hint {
        top: 16px;
        left: 16px;
        right: 16px;
        bottom: auto;
        text-align: left;
        font-size: 11px;
      }

      .gui-caption {
        left: 14px;
        bottom: 124px;
      }

      .gui-kicker {
        font-size: 11px;
        margin-left: 0;
      }

      .gui-headline {
        font-size: min(14.5vw, 13vh);
        white-space: normal;
        line-height: 0.84;
        transform: none;
      }

      .gui-headline .br-mobile {
        display: inline;
      }

      .gui-arrows {
        right: 16px;
        bottom: 20px;
      }

      .arrow-btn {
        width: 44px;
        height: 44px;
      }

      .arrow-btn svg {
        width: 18px;
        height: 18px;
      }

      .gui-toggle {
        right: 16px;
        bottom: 78px;
      }

      .toggle-btn {
        height: 26px;
      }

      section#list {
        padding: 32px 16px 96px;
      }

      .lightbox {
        padding: 16px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .gui-headline {
        font-size: min(7.5vw, 20vh);
        white-space: nowrap;
      }

      .gui-headline .br-mobile {
        display: none;
      }

      .gui-caption {
        bottom: 18px;
      }

      .gui-hint {
        display: none;
      }

      .gui-arrows {
        right: 16px;
        bottom: 20px;
      }

      .gui-toggle {
        top: 16px;
        right: 16px;
        bottom: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
        animation-duration: 0s !important;
      }
    }
  </style>
</head>

    <div id="veil"></div>
  </main>

  <div class="gui" id="gui">
    <div class="gui-arrows">
      <button type="button" class="arrow-btn" id="btn-prev" aria-label="Walk backward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button type="button" class="arrow-btn" id="btn-next" aria-label="Walk forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

    <div class="gui-hint" id="gui-hint">
      <span class="mask"><span class="rise" id="hint-1">Scroll or drag to walk round</span></span>

      <button type="button" class="toggle-btn" id="toggle-list" role="tab" aria-selected="false">LIST</button>

    <div class="gui-caption">
      <p class="gui-kicker"><span class="mask"><span class="rise">YOU ARE WALKING PAST</span></span></p>
      <h1 class="gui-headline"><span class="mask"><span class="rise">PHOTOGRAPHY <br class="br-mobile" />PORTFOLIO</span></span></h1>
    </div>
  </div>

  <div id="open-pill">OPEN THE PHOTO</div>

  <section id="list" aria-hidden="true">
    <h2 class="list-heading">PHOTOGRAPHY PORTFOLIO — ALL PHOTOS</h2>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">

    <img id="lb-img" src="" alt="" />
    <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next photo">›</button>
  </div>

    const N = PHOTOS.length;

    const smallScreenMQ = window.matchMedia('(max-width: 819px), (orientation: portrait) and (max-width: 1100px), (orientation: landscape) and (max-height: 500px)');

    // --- Three.js Scene Setup ---
    const galleryEl = document.getElementById('gallery');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(

    scene.add(new THREE.AmbientLight(0xfff6e6, 0.55));

    function makeVerticalGradientTexture(stops) {
      const c = document.createElement('canvas');
      c.width = 4;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      stops.forEach(([offset, color]) => g.addColorStop(offset, color));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 4, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(512, 512, 512 * 12.2 / 18, 512, 512, 512);
      g.addColorStop(0, '#EDD6B0');
      g.addColorStop(0.55, '#F3E1C3');
      g.addColorStop(1, '#EFDAB8');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1024, 1024);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRadialAlphaTexture(stops) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach(([offset, color]) => g.addColorStop(offset, color));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

        side: THREE.BackSide

    // --- Frames ---
    // Every frame is built from unit-sized pieces and scaled to its photo's shape.
    const PY = 1.95;            // height of frame centres
    const BOX_H = 1.83;         // tallest a photo can be
    const BOX_MAX_W = 2.3;      // widest a photo can be
    const DEFAULT_ASPECT = 0.8; // shape used until a photo's real shape is known
    const LABEL_CW = 512;
    const LABEL_CH = 208;
    const LABEL_W = 0.92;
    const LABEL_H = LABEL_W * LABEL_CH / LABEL_CW;

    const blankTex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
    blankTex.needsUpdate = true;

    const haloMat = new THREE.MeshBasicMaterial({
      map: makeRadialAlphaTexture([[0, 'rgba(255,255,255,0.95)'], [0.35, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,255,255,0)']]),
      transparent: true,
      depthWrite: false,
      fog: true

    const shadowMat = new THREE.MeshBasicMaterial({
      map: makeRadialAlphaTexture([[0, 'rgba(120,90,50,0.28)'], [0.25, 'rgba(120,90,50,0.28)'], [1, 'rgba(120,90,50,0)']]),
      transparent: true,
      depthWrite: false,
      fog: true
    });
    const frameMat = new THREE.MeshBasicMaterial({ color: '#D3AA72', fog: true });
    const placeholderMat = new THREE.MeshBasicMaterial({ color: '#F6EAD8', fog: true });

    const unitPlane = new THREE.PlaneGeometry(1, 1);
    const frameGeo = new THREE.BoxGeometry(1, 1, 0.06);
    const labelGeo = new THREE.PlaneGeometry(LABEL_W, LABEL_H);

    const slots = [];
    const artMeshes = [];

    function createSlot(wall, index, count, theta, radius) {
      const group = new THREE.Group();
      const gx = radius * Math.cos(theta);
      const gz = radius * Math.sin(theta);
      group.position.set(gx, 0, gz);
      if (wall === 'outer') {
        group.lookAt(0, 0, 0);
      } else {
        group.lookAt(2 * gx, 0, 2 * gz);
      }

      const halo = new THREE.Mesh(unitPlane, haloMat);
      halo.position.set(0, PY + 0.05, 0.005);
      group.add(halo);

      const shadow = new THREE.Mesh(unitPlane, shadowMat);
      shadow.position.set(0.05, PY - 0.06, 0.01);
      group.add(shadow);

      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.set(0, PY, 0.045);
      group.add(frame);

      const placeholder = new THREE.Mesh(unitPlane, placeholderMat);
      placeholder.position.set(0, PY, 0.077);
      group.add(placeholder);

      const mat = new THREE.MeshBasicMaterial({ map: blankTex, transparent: true, opacity: 0, fog: true });
      const art = new THREE.Mesh(unitPlane, mat);
      art.position.set(0, PY, 0.08);
      group.add(art);

      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = LABEL_CW;
      labelCanvas.height = LABEL_CH;
      const labelTex = new THREE.CanvasTexture(labelCanvas);
      labelTex.colorSpace = THREE.SRGBColorSpace;
      const label = new THREE.Mesh(
        labelGeo,
        new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, depthWrite: false, fog: true })
      );
      group.add(label);

      scene.add(group);

      const slot = {
        wall, index, count, theta,
        group, halo, shadow, frame, placeholder, art, mat, label, labelCanvas, labelTex,
        photoIdx: -1,
        lap: null,
        token: 0,
        tex: null,
        hiTex: null,
        hiLoading: false,
        needsLoad: false,
        fadeStart: -1,
        w: 1,
        h: 1
      };
      art.userData.slot = slot;
      artMeshes.push(art);
      slots.push(slot);
      setSlotSize(slot, DEFAULT_ASPECT);
      return slot;
    }

    function setSlotSize(slot, aspect) {
      const h = Math.min(BOX_H, BOX_MAX_W / aspect);
      const w = h * aspect;
      slot.w = w;
      slot.h = h;
      slot.art.scale.set(w, h, 1);
      slot.placeholder.scale.set(w, h, 1);
      slot.frame.scale.set(w + 0.07, h + 0.07, 1);
      slot.halo.scale.set(w + 1.5, 1.75 * h, 1);
      slot.shadow.scale.set(w + 0.34, 1.18 * h, 1);
      slot.label.position.set(-w / 2 + LABEL_W / 2, PY - h / 2 - 0.42, 0.02);
    }

    function drawLabel(slot) {
      const ctx = slot.labelCanvas.getContext('2d');
      ctx.clearRect(0, 0, LABEL_CW, LABEL_CH);
      if (slot.photoIdx >= 0) {
        ctx.fillStyle = '#3A3550';
        ctx.font = '500 46px "Newsreader", Georgia, serif';
        ctx.fillText(WALL_LABEL, 24, 66);
      }
      slot.labelTex.needsUpdate = true;
    }

    const OUTER_COUNT = 36;
    const INNER_COUNT = 24;
    for (let s = 0; s < OUTER_COUNT; s++) {
      createSlot('outer', s, OUTER_COUNT, s * (2 * Math.PI / OUTER_COUNT), 17.98);
    }
    for (let k = 0; k < INNER_COUNT; k++) {
      createSlot('inner', k, INNER_COUNT, (k + 0.5) * (2 * Math.PI / INNER_COUNT), 12.22);
    }

    // --- Loading photos (memory-limited) ---
    // Each photo is downloaded, shrunk on a canvas, sent to the GPU, and the canvas is then
    // emptied, so only the small GPU copy stays in memory.
    async function loadScaled(url, maxEdge) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.decoding = 'async';
      img.src = url;
      if (img.decode) {
        await img.decode();
      } else {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });
      }
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;
      if (!iw || !ih) throw new Error('Image has no size');

      const scale = Math.min(1, maxEdge / Math.max(iw, ih));
      const tw = Math.max(1, Math.round(iw * scale));
      const th = Math.max(1, Math.round(ih * scale));

      // Halve in steps for very large photos so the result stays sharp.
      let src = img;
      let sw = iw;
      let sh = ih;
      while (sw > tw * 2) {
        const nw = Math.round(sw / 2);
        const nh = Math.round(sh / 2);
        const step = document.createElement('canvas');
        step.width = nw;
        step.height = nh;
        const sctx = step.getContext('2d');
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(src, 0, 0, nw, nh);
        src = step;
        sw = nw;
        sh = nh;
      }

      const canvas = document.createElement('canvas');
      canvas.width = tw;
      canvas.height = th;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, tw, th);
      return { canvas, aspect: iw / ih };
    }

    function makeTexture(canvas) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      tex.onUpdate = () => {
        tex.onUpdate = null;
        canvas.width = 1;
        canvas.height = 1;
      };
      renderer.initTexture(tex);
      return tex;
    }

    function dropHiRes(slot) {
      if (slot.hiTex) {
        slot.mat.map = slot.tex || blankTex;
        slot.hiTex.dispose();
        slot.hiTex = null;
      }
    }

    function assignPhoto(slot, idx) {
      if (slot.photoIdx === idx) return;
      slot.photoIdx = idx;
      slot.token++;
      dropHiRes(slot);
      slot.hiLoading = false;
      if (slot.tex) {
        slot.tex.dispose();
        slot.tex = null;
      }
      slot.mat.map = blankTex;
      slot.mat.opacity = 0;
      slot.fadeStart = -1;
      setSlotSize(slot, aspectCache[idx] || DEFAULT_ASPECT);
      drawLabel(slot);
      slot.needsLoad = true;
    }

    // Which photo a frame shows depends on how many laps the visitor has walked, so the
    // sequence keeps going round after round. A frame only changes once it is about half a
    // lap away (behind the central pillar), with a little slack so it doesn't flicker.
    function updateSlots() {
      for (const slot of slots) {
        const raw = (pose.th - slot.theta) / (2 * Math.PI);
        if (slot.lap === null || Math.abs(raw - slot.lap) > 0.55) {
          slot.lap = Math.round(raw);
        }
        const k = slot.index + slot.count * slot.lap;
        const idx = slot.wall === 'outer' ? mod(-k - 1, N) : mod(-k + INNER_OFFSET, N);
        assignPhoto(slot, idx);
      }
    }

    let activeLoads = 0;
    let settledLoads = 0;
    let resolveFirstLoads;
    const firstLoadsPromise = new Promise((resolve) => {
      resolveFirstLoads = resolve;
    });

    function pumpLoads() {
      while (activeLoads < MAX_CONCURRENT) {
        let best = null;
        let bestD = Infinity;
        for (const slot of slots) {
          if (!slot.needsLoad) continue;
          const d = Math.abs(wrapAngle(slot.theta - pose.th));
          if (d < bestD) {
            bestD = d;
            best = slot;
          }
        }
        if (!best) return;
        best.needsLoad = false;
        startLoad(best);
      }
    }

    function startLoad(slot) {
      const token = slot.token;
      const idx = slot.photoIdx;
      activeLoads++;
      loadScaled(photoURL(idx), WALL_EDGE)
        .then(({ canvas, aspect }) => {
          aspectCache[idx] = aspect;
          if (slot.token !== token) return;
          slot.tex = makeTexture(canvas);
          slot.mat.map = slot.tex;
          setSlotSize(slot, aspect);
          if (isReducedMotion()) {
            slot.mat.opacity = 1;
          } else {
            slot.fadeStart = performance.now();
          }
          if (focusedSlot === slot && !glide) loadHiRes(slot);
        })
        .catch(() => {
          console.warn(`Could not load ${photoURL(idx)}`);
        })
        .finally(() => {
          activeLoads--;
          settledLoads++;
          if (settledLoads >= 6) resolveFirstLoads();
        });
    }

    function loadHiRes(slot) {
      if (!slot.tex || slot.hiTex || slot.hiLoading) return;
      const token = slot.token;
      slot.hiLoading = true;
      loadScaled(photoURL(slot.photoIdx), CLOSE_EDGE)
        .then(({ canvas }) => {
          if (slot.token !== token || focusedSlot !== slot || slot.hiTex) return;
          slot.hiTex = makeTexture(canvas);
          slot.mat.map = slot.hiTex;
        })
        .catch(() => {})
        .finally(() => {
          if (slot.token === token) slot.hiLoading = false;
        });
    }

    // --- Camera Pose & Navigation State ---
    const STEP = (2 * Math.PI) / OUTER_COUNT;
    const getWalkOffsetD = () => (isPortraitSmall() ? 0.14 + 0.9 * STEP : 0.14);

    function getWalkPoseParams() {
      if (isPortraitSmall()) {
        return { r: 15.4, yaw: -0.42, y: 1.90, pitch: -0.10 };
      }
      return { r: 15.6, yaw: -0.30, y: 1.92, pitch: -0.12 };
    }

    function getFocusPoseParams(wall) {
      if (isPortraitSmall()) {
        return wall === 'outer'
          ? { r: 18 - 5.2, yaw: Math.PI / 2, y: PY - 1.05, pitch: 0 }
          : { r: 12.2 + 5.2, yaw: -Math.PI / 2, y: PY - 1.05, pitch: 0 };
      }
      return wall === 'outer'
        ? { r: 18 - 4.26, yaw: Math.PI / 2, y: PY - 0.52, pitch: 0 }
        : { r: 12.2 + 4.26, yaw: -Math.PI / 2, y: PY - 0.52, pitch: 0 };
    }

    let D = getWalkOffsetD();
    const initialWalk = getWalkPoseParams();
    const pose = {
      th: D + 0.16,
      r: initialWalk.r - 0.35,
      yaw: initialWalk.yaw,
      y: initialWalk.y,
      pitch: initialWalk.pitch
    };
    let targetTh = D;
    let focusedSlot = null;
    let glide = null;
    let introGlide = null;

    function applyCameraPose() {
      const px = pose.r * Math.cos(pose.th);
      const pz = pose.r * Math.sin(pose.th);
      const tx = Math.sin(pose.th);
      const tz = -Math.cos(pose.th);
      const nx = Math.cos(pose.th);
      const nz = Math.sin(pose.th);
      const dx = Math.cos(pose.yaw) * tx + Math.sin(pose.yaw) * nx;
      const dz = Math.cos(pose.yaw) * tz + Math.sin(pose.yaw) * nz;
      camera.position.set(px, pose.y, pz);
      camera.lookAt(px + dx, pose.y + pose.pitch, pz + dz);
    }

    const hint1El = document.getElementById('hint-1');
    const hint2El = document.getElementById('hint-2');
    const openPillEl = document.getElementById('open-pill');

    function setHintMode(focused) {
      if (focused) {
        hint1El.textContent = 'Click the photo to open it';
        hint2El.textContent = 'Esc or click away to step back';
      } else {
        hint1El.textContent = 'Scroll or drag to walk round';
        hint2El.textContent = 'Click a photo to look closer';
      }
    }

    function startGlide(toPose, durationSec, onComplete) {
      if (isReducedMotion() || durationSec <= 0) {
        Object.assign(pose, toPose);
        glide = null;
        if (onComplete) onComplete();
        return;
      }
      glide = {
        from: { ...pose },
        to: { ...toPose },
        elapsed: 0,
        duration: durationSec,
        onComplete
      };
    }

    function focusSlot(slot) {
      if (focusedSlot && focusedSlot !== slot) dropHiRes(focusedSlot);
      focusedSlot = slot;
      setHintMode(true);
      const fp = getFocusPoseParams(slot.wall);
      const destTh = pose.th + wrapAngle(slot.theta - pose.th);
      targetTh = destTh;
      startGlide({ th: destTh, r: fp.r, yaw: fp.yaw, y: fp.y, pitch: fp.pitch }, 0.95, () => {
        if (focusedSlot === slot) loadHiRes(slot);
      });
    }

    function stepBackToWalk() {
      if (!focusedSlot && !glide) return;
      if (focusedSlot) dropHiRes(focusedSlot);
      focusedSlot = null;
      setHintMode(false);
      openPillEl.style.opacity = '0';
      const wp = getWalkPoseParams();
      D = getWalkOffsetD();
      targetTh = pose.th + D;
      startGlide({ th: targetTh, r: wp.r, yaw: wp.yaw, y: wp.y, pitch: wp.pitch }, 0.95);
    }

    // --- Intro Entrance ---
    let introStarted = false;
    function startIntro() {
      if (introStarted) return;
      introStarted = true;
      slots.forEach(drawLabel);

      const veil = document.getElementById('veil');
      const wp = getWalkPoseParams();
      D = getWalkOffsetD();
      targetTh = D;

      if (isReducedMotion()) {
        veil.style.display = 'none';
        Object.assign(pose, { th: D, ...wp });
        return;
      }

      veil.animate([{ opacity: 1 }, { opacity: 0 }], {
        duration: 900,
        easing: 'ease-out',
        fill: 'forwards'
      }).onfinish = () => {
        veil.style.display = 'none';
      };

      introGlide = {
        from: { th: D + 0.16, r: wp.r - 0.35, yaw: wp.yaw, y: wp.y, pitch: wp.pitch },
        to: { th: D, r: wp.r, yaw: wp.yaw, y: wp.y, pitch: wp.pitch },
        elapsed: 0,
        duration: 1.4
      };

      const rises = Array.from(document.querySelectorAll('.gui .rise'));
      rises.forEach((el, idx) => {
        el.animate(
          [{ transform: 'translateY(105%)' }, { transform: 'translateY(0)' }],
          {
            duration: 1000,
            delay: 250 + idx * 60,
            easing: 'cubic-bezier(.2,.7,.2,1)',
            fill: 'backwards'
          }
        );
      });
    }

    // Labels need the fonts; redraw once they are ready.
    document.fonts.ready.then(() => slots.forEach(drawLabel));

    // Start once the nearest photos are in (or after 4 s, whichever comes first).
    const failsafeTimer = setTimeout(startIntro, 4000);
    Promise.all([firstLoadsPromise, document.fonts.ready]).then(() => {
      clearTimeout(failsafeTimer);
      startIntro();
    });

    // --- Raycasting & Projected Screen Rectangles ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    function getProjectedScreenRect(mesh) {
      mesh.updateWorldMatrix(true, false);
      const corners = [
        new THREE.Vector3(-0.5, -0.5, 0),
        new THREE.Vector3(0.5, -0.5, 0),
        new THREE.Vector3(0.5, 0.5, 0),
        new THREE.Vector3(-0.5, 0.5, 0)
      ];
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      corners.forEach((v) => {
        v.applyMatrix4(mesh.matrixWorld);
        v.project(camera);
        const sx = (v.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
        minX = Math.min(minX, sx);
        maxX = Math.max(maxX, sx);
        minY = Math.min(minY, sy);
        maxY = Math.max(maxY, sy);
      });
      return { left: minX, top: minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
    }

    function raycastSlot(clientX, clientY) {
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(artMeshes, false);
      return hits.length > 0 ? hits[0].object.userData.slot : null;
    }

    // --- Gallery Pointer, Wheel & Keyboard Controls (direction reversed) ---
    let pointerDown = false;
    let dragging = false;
    let downX = 0;
    let downY = 0;
    let downTargetTh = 0;

    galleryEl.addEventListener('pointerdown', (e) => {
      if (isOverlayOpen()) return;
      pointerDown = true;
      dragging = false;
      downX = e.clientX;
      downY = e.clientY;
      downTargetTh = targetTh;
      galleryEl.setPointerCapture(e.pointerId);
    });

    galleryEl.addEventListener('pointermove', (e) => {
      if (isOverlayOpen()) return;

      if (pointerDown) {
        const dx = e.clientX - downX;
        const dy = e.clientY - downY;
        if (!dragging && Math.hypot(dx, dy) > 6) {
          dragging = true;
          galleryEl.classList.add('dragging');
          if (focusedSlot) {
            stepBackToWalk();
            downTargetTh = targetTh;
          }
        }
        if (dragging) {
          const primaryDelta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
          const speed = isSmallScreen() ? 0.0042 : 0.0022;
          targetTh = downTargetTh - primaryDelta * speed;
          return;
        }
      }

      const hit = raycastSlot(e.clientX, e.clientY);
      galleryEl.classList.toggle('hover-print', Boolean(hit));

      if (!isSmallScreen()) {
        if (focusedSlot && hit === focusedSlot) {
          openPillEl.style.left = `${e.clientX}px`;
          openPillEl.style.top = `${e.clientY}px`;
          openPillEl.style.opacity = '1';
        } else {
          openPillEl.style.opacity = '0';
        }
      }
    });

    galleryEl.addEventListener('pointerup', (e) => {
      if (!pointerDown) return;
      pointerDown = false;
      galleryEl.classList.remove('dragging');
      if (galleryEl.hasPointerCapture(e.pointerId)) {
        galleryEl.releasePointerCapture(e.pointerId);
      }

      if (!dragging && !isOverlayOpen()) {
        const hit = raycastSlot(e.clientX, e.clientY);
        if (hit) {
          if (focusedSlot === hit) {
            openLightbox(hit.photoIdx);
          } else {
            focusSlot(hit);
          }
        } else if (focusedSlot) {
          stepBackToWalk();
        }
      }
      dragging = false;
    });

    galleryEl.addEventListener('wheel', (e) => {
      if (isOverlayOpen()) return;
      e.preventDefault();
      if (focusedSlot) {
        stepBackToWalk();
      }
      const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
      targetTh += delta * 0.0016;
    }, { passive: false });

    function stepSlot(dir) {
      if (isOverlayOpen()) return;
      if (focusedSlot) {
        stepBackToWalk();
      }
      D = getWalkOffsetD();
      targetTh = (Math.round((targetTh - D) / STEP) + dir) * STEP + D;
    }

    document.getElementById('btn-prev').addEventListener('click', () => stepSlot(-1));
    document.getElementById('btn-next').addEventListener('click', () => stepSlot(1));

    // --- List View ---
    const listEl = document.getElementById('list');
    const listGridEl = document.getElementById('list-grid');
    const toggleGalleryBtn = document.getElementById('toggle-gallery');
    const toggleListBtn = document.getElementById('toggle-list');
    let listBuilt = false;

    function buildList() {
      if (listBuilt) return;
      listBuilt = true;
      const frag = document.createDocumentFragment();
      PHOTOS.forEach((file, i) => {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = photoLabel(i);
        if (aspectCache[i]) img.style.aspectRatio = `auto ${aspectCache[i]}`;
        img.src = photoURL(i);
        fig.appendChild(img);
        fig.addEventListener('click', () => openLightbox(i));
        frag.appendChild(fig);
      });
      listGridEl.appendChild(frag);
    }

    function setToggle(listActive) {
      toggleListBtn.classList.toggle('active', listActive);
      toggleListBtn.setAttribute('aria-selected', String(listActive));
      toggleGalleryBtn.classList.toggle('active', !listActive);
      toggleGalleryBtn.setAttribute('aria-selected', String(!listActive));
    }

    function openListView() {
      buildList();
      listEl.classList.add('open');
      setToggle(true);
      syncOverlayState();
    }

    function returnToGallery() {
      if (!listEl.classList.contains('open')) return;
      listEl.classList.remove('open');
      setToggle(false);
      syncOverlayState();
    }

    toggleGalleryBtn.addEventListener('click', returnToGallery);
    toggleListBtn.addEventListener('click', openListView);

    // --- Lightbox ---
    const lightboxEl = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    let lbIndex = 0;

    function showLightboxPhoto(i) {
      lbIndex = mod(i, N);
      lbImg.src = photoURL(lbIndex);
      lbImg.alt = photoLabel(lbIndex);
    }

    function openLightbox(i) {
      showLightboxPhoto(i);
      lightboxEl.classList.add('open');
      syncOverlayState();
    }

    function closeLightbox() {
      lightboxEl.classList.remove('open');
      syncOverlayState();
    }

    function isLightboxOpen() {
      return lightboxEl.classList.contains('open');
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => showLightboxPhoto(lbIndex - 1));
    document.getElementById('lb-next').addEventListener('click', () => showLightboxPhoto(lbIndex + 1));
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });

    // --- Overlay State ---
    function isOverlayOpen() {
      return listEl.classList.contains('open') || isLightboxOpen();
    }

    function syncOverlayState() {
      const listOpen = listEl.classList.contains('open');
      document.body.classList.toggle('list-open', listOpen);
      listEl.setAttribute('aria-hidden', String(!listOpen));
      lightboxEl.setAttribute('aria-hidden', String(!isLightboxOpen()));
      openPillEl.style.opacity = '0';
    }

    window.addEventListener('keydown', (e) => {
      if (isLightboxOpen()) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowRight') showLightboxPhoto(lbIndex + 1);
        else if (e.key === 'ArrowLeft') showLightboxPhoto(lbIndex - 1);
        return;
      }
      if (e.key === 'Escape') {
        if (listEl.classList.contains('open')) {
          returnToGallery();
        } else if (focusedSlot) {
          stepBackToWalk();
        }
        return;
      }
      if (!isOverlayOpen()) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          stepSlot(1);
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          stepSlot(-1);
        }
      }
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.fov = w >= h ? 56 : 70;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h);
    });

    // --- Animation Loop ---
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (introGlide) {
        introGlide.elapsed += dt;
        const rawT = Math.min(1, introGlide.elapsed / introGlide.duration);
        const eased = rawT === 1 ? 1 : 1 - Math.pow(2, -10 * rawT);
        for (const key of ['th', 'r', 'yaw', 'y', 'pitch']) {
          pose[key] = introGlide.from[key] + (introGlide.to[key] - introGlide.from[key]) * eased;
        }
        if (rawT >= 1) {
          introGlide = null;
        }
      } else if (glide) {
        glide.elapsed += dt;
        const t = Math.min(1, glide.elapsed / glide.duration);
        const easeTh = 1 - Math.pow(1 - t, 4);
        const easeYaw = 1 - Math.pow(1 - t, 2);
        const easeCubic = 1 - Math.pow(1 - t, 3);

        pose.th = glide.from.th + (glide.to.th - glide.from.th) * easeTh;
        pose.yaw = glide.from.yaw + (glide.to.yaw - glide.from.yaw) * easeYaw;
        pose.r = glide.from.r + (glide.to.r - glide.from.r) * easeCubic;
        pose.y = glide.from.y + (glide.to.y - glide.from.y) * easeCubic;
        pose.pitch = glide.from.pitch + (glide.to.pitch - glide.from.pitch) * easeCubic;

        if (t >= 1) {
          const done = glide.onComplete;
          glide = null;
          if (done) done();
        }
      } else if (!focusedSlot) {
        if (isReducedMotion()) {
          pose.th = targetTh;
        } else {
          pose.th += (targetTh - pose.th) * (1 - Math.exp(-dt / 0.36));
        }
      }

      updateSlots();
      pumpLoads();

      for (const slot of slots) {
        if (slot.fadeStart < 0) continue;
        const t = (now - slot.fadeStart) / 450;
        if (t >= 1) {
          slot.mat.opacity = 1;
          slot.fadeStart = -1;
        } else {
          slot.mat.opacity = Math.max(0, t);
        }
      }

      applyCameraPose();

      // Small-screen automatic pill positioning on focused photo
      if (isSmallScreen() && focusedSlot && !glide && !isOverlayOpen()) {
        const rect = getProjectedScreenRect(focusedSlot.art);
        openPillEl.style.left = `${rect.left + rect.width * 0.5}px`;
        openPillEl.style.top = `${rect.top + rect.height * 0.55}px`;
        openPillEl.style.opacity = '1';
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
