<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Henrique Vasconcellos Filho</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap');

  :root {
    --bg: #F1F3EF;
    --ink: #1E2420;
    --line: #C7CDC3;
    --accent: #3D5A45;
    --muted: #6B7268;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 56px 24px 80px;
  }

  header {
    max-width: 1000px;
    margin: 0 auto 40px;
  }

  .back {
    display: inline-block;
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 20px;
  }

  .back:hover { color: var(--accent); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.01em;
    margin: 0 0 8px 0;
  }

  header p {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 560px;
    line-height: 1.6;
  }

  .grid {
    max-width: 1000px;
    margin: 0 auto;
    columns: 3 240px;
    column-gap: 14px;
  }

  .grid figure {
    margin: 0 0 14px;
    break-inside: avoid;
    cursor: zoom-in;
    overflow: hidden;
  }

  .grid img {
    width: 100%;
    display: block;
    transition: transform 0.3s ease;
  }

  .grid figure:hover img {
    transform: scale(1.02);
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 20, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 32px;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 90vh;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .lightbox .close,
  .lightbox .nav {
    position: absolute;
    background: none;
    border: none;
    color: #EDEFEB;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    cursor: pointer;
    padding: 10px 14px;
  }

  .lightbox .close {
    top: 20px;
    right: 20px;
  }

  .lightbox .prev { left: 12px; top: 50%; transform: translateY(-50%); font-size: 24px; }
  .lightbox .next { right: 12px; top: 50%; transform: translateY(-50%); font-size: 24px; }

  @media (prefers-reduced-motion: reduce) {
    .grid img { transition: none; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">&larr; Back to home</a>
  <h1>Photography Portfolio</h1>
  <p>A variety of pictures I have personally taken! Experienced as a photographer for-hire. Contact for business inquiries.</p>
</header>

<div class="grid" id="gallery">
  <!--
    Add one <figure> per photo. Replace src with your actual filenames
    once uploaded into a /photos folder in the same repo.
    Example: <figure><img src="photos/photo-01.jpg" alt="Description of photo"></figure>
  -->
  <figure><img src="photos/photo-01.jpg" alt="Photo 1"></figure>
  <figure><img src="photos/photo-02.jpg" alt="Photo 2"></figure>
  <figure><img src="photos/photo-03.jpg" alt="Photo 3"></figure>
  <figure><img src="photos/photo-04.jpg" alt="Photo 4"></figure>
  <figure><img src="photos/photo-05.jpg" alt="Photo 5"></figure>
  <figure><img src="photos/photo-06.jpg" alt="Photo 6"></figure>
</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="closeBtn">Close ✕</button>
  <button class="nav prev" id="prevBtn">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="nav next" id="nextBtn">›</button>
</div>

<script>
  const images = Array.from(document.querySelectorAll('#gallery img'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    lightboxImg.src = images[currentIndex].src;
    lightboxImg.alt = images[currentIndex].alt;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
  }

  function showNext(delta) {
    currentIndex = (currentIndex + delta + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
    lightboxImg.alt = images[currentIndex].alt;
  }

  images.forEach((img, i) => {
    img.parentElement.addEventListener('click', () => openLightbox(i));
  });

  document.getElementById('closeBtn').addEventListener('click', closeLightbox);
  document.getElementById('prevBtn').addEventListener('click', () => showNext(-1));
  document.getElementById('nextBtn').addEventListener('click', () => showNext(1));

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext(1);
    if (e.key === 'ArrowLeft') showNext(-1);
  });
</script>

</body>
</html>
